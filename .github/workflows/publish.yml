name: Publish

on:
  push:
    tags:
      - 'v*'

# 公開ジョブはリポジトリへ書き込まない。GITHUB_TOKEN は読み取り専用に絞る。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続のステップに GITHUB_TOKEN を残さない。
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 依存クレートがゼロのためビルドキャッシュの効果はほぼない。秘密情報を扱う公開ジョブでは
      # キャッシュ汚染（cache poisoning）の経路を減らすため、キャッシュを使わない。

      # タグ v0.2.0 → バージョン 0.2.0 を取り出す。SemVer 以外のタグは拒否する
      # （この検査は、後段の sed に `/` や `&` などの特殊文字が渡らないことも保証する）。
      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s\n' "${VERSION}" | grep -Eq "${SEMVER}"; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid SemVer version (expected e.g. v1.2.3)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} -> version ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Cargo.toml の version をタグの値で上書きする（手動更新が不要になる）。
      # 書き換えるのは先頭の（[package] の）version 行だけにし、結果も検証する。
      - name: Inject version into Cargo.toml
        run: |
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          if [ "$(grep -m1 '^version = ' Cargo.toml)" != "version = \"${VERSION}\"" ]; then
            echo "::error::Failed to inject version ${VERSION} into Cargo.toml"
            exit 1
          fi

      - name: Verify build and tests
        run: cargo test --verbose

      # トークンはコマンドライン引数ではなく環境変数で渡す（cargo が CARGO_REGISTRY_TOKEN を読む）。
      # sed で Cargo.toml を書き換えたため --allow-dirty が必要。
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
